# ════════════════════════════════════════════════════════════════════════
#  CCTV Monitor Hub — konfigurasi deployment lokal (Docker Compose)
#  Salin file ini menjadi ".env" lalu isi nilainya.
#     cp convex.conf .env
#  Atau jalankan: ./scripts/generate-secrets.sh  (mengisi otomatis)
# ════════════════════════════════════════════════════════════════════════

# ── Web app (port yang Anda minta) ────────────────────────────────────────
WEB_PORT=8092

# ── Convex backend self-hosted (database lokal di server Anda) ───────────
# Port internal tidak perlu diubah; backend hanya diakses lewat jaringan Docker.
CONVEX_BACKEND_PORT=3210
CONVEX_SITE_PROXY_PORT=3211
CONVEX_DASHBOARD_PORT=6791

# Alamat publik aplikasi web (dipakai auth & backend).
# Ganti IP ini dengan IP LAN server Anda, mis. http://192.168.1.10:8092
PUBLIC_WEB_URL=http://localhost:8092

# ── Secret backend (WAJIB diisi) ──────────────────────────────────────────
# Kunci instance Convex — isi dengan 64 karakter hex acak.
# generate-secrets.sh akan mengisinya otomatis.
INSTANCE_SECRET=
INSTANCE_NAME=cctv-monitor

# Kunci penandatangan JWT untuk login (RS256, PKCS#8).
# generate-secrets.sh akan mengisinya otomatis.
JWT_PRIVATE_KEY=
